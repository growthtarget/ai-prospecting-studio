<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 15px; color: #202124; background-color: #f8f9fa; }
      .card { background: white; border: 1px solid #dadce0; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(60,64,67,0.1); }
      h2 { font-size: 16px; margin-top: 0; color: #1a73e8; border-bottom: 1px solid #eee; padding-bottom: 8px; }
      h3 { font-size: 13px; margin: 12px 0 4px; color: #3c4043; text-transform: uppercase; letter-spacing: 0.5px; }
      .field-group { margin-bottom: 12px; }
      label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #5f6368; }
      select, input[type="text"] { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #dadce0; border-radius: 4px; font-size: 13px; }
      .criteria-box { background: #f1f3f4; border-radius: 4px; padding: 10px; font-size: 12px; line-height: 1.4; color: #3c4043; }
      .btn { width: 100%; padding: 10px; font-size: 13px; font-weight: 600; border-radius: 4px; cursor: pointer; border: none; margin-top: 8px; transition: background 0.2s; }
      .btn-primary { background: #1a73e8; color: white; }
      .btn-primary:hover { background: #1557b0; }
      .btn-secondary { background: #e8f0fe; color: #1a73e8; border: 1px solid #dadce0; }
      .btn-secondary:hover { background: #d2e3fc; }
      .status { font-size: 12px; padding: 8px; border-radius: 4px; margin-top: 10px; display: none; }
      .status.info { display: block; background: #e8f0fe; color: #1a73e8; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; background: #e6f4ea; color: #137333; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Prospecting Control Panel</h2>
      <div class="field-group">
        <label for="campaignSelect">Select Campaign</label>
        <select id="campaignSelect" onchange="loadCampaignDetails()">
          <option value="">-- Choose Campaign --</option>
        </select>
      </div>
      <div id="campaignDetails" style="display:none;">
        <h3>Target Profile</h3>
        <div class="criteria-box">
          <div><strong>Country:</strong> <span id="lblCountry">-</span></div>
          <div><strong>Industry:</strong> <span id="lblIndustry">-</span></div>
          <div><strong>Size:</strong> <span id="lblSize">-</span></div>
        </div>
      </div>
    </div>

    <!-- Step 1: Discover -->
    <div class="card">
      <h2>Step 1: Company Discovery</h2>
      <p style="font-size:12px; color:#5f6368; margin-top:0;">Search the web with Gemini to find companies matching your target profile.</p>
      <button class="btn btn-primary" onclick="triggerDiscovery()">🔍 Discover Target Companies</button>
    </div>

    <!-- Step 2: Persona Mapping -->
    <div class="card">
      <h2>Step 2: Persona Mapping</h2>
      <p style="font-size:12px; color:#5f6368; margin-top:0;">Enrich discovered companies, find decision-maker emails, and draft hooks.</p>
      <button class="btn btn-primary" onclick="triggerPersonaMapper()">👤 Run Persona Mapper</button>
    </div>

    <!-- Step 3: Review -->
    <div class="card">
      <h2>Step 3: Human Review</h2>
      <button class="btn btn-secondary" onclick="openReviewQueue()">📋 Open Prospect Review Queue</button>
    </div>

    <div id="statusBox" class="status"></div>

    <script>
      window.onload = function() {
        google.script.run.withSuccessHandler(populateCampaigns).getAvailableCampaignsList();
      };

      function populateCampaigns(campaigns) {
        const select = document.getElementById('campaignSelect');
        select.innerHTML = '<option value="">-- Choose Campaign --</option>';
        campaigns.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.id + ' - ' + c.name;
          select.appendChild(opt);
        });
      }

      function loadCampaignDetails() {
        const campaignId = document.getElementById('campaignSelect').value;
        if (!campaignId) {
          document.getElementById('campaignDetails').style.display = 'none';
          return;
        }
        google.script.run.withSuccessHandler(renderDetails).getCampaignTargetingSummary(campaignId);
      }

      function renderDetails(data) {
        if (!data) return;
        document.getElementById('lblCountry').textContent = data.country || 'Any';
        document.getElementById('lblIndustry').textContent = data.industry || 'Any';
        document.getElementById('lblSize').textContent = data.size || 'Any';
        document.getElementById('campaignDetails').style.display = 'block';
      }

      function showStatus(msg) {
        const box = document.getElementById('statusBox');
        box.textContent = msg;
        box.className = 'status info';
      }

      function triggerDiscovery() {
        const id = document.getElementById('campaignSelect').value;
        if (!id) { alert('Please select a campaign first.'); return; }
        showStatus('Running Gemini Company Discovery... Please check the spreadsheet alert.');
        google.script.run.runCompanyDiscoveryForSelectedCampaign();
      }

      function triggerPersonaMapper() {
        const id = document.getElementById('campaignSelect').value;
        if (!id) { alert('Please select a campaign first.'); return; }
        showStatus('Running Persona Mapper... Please check the spreadsheet alert.');
        google.script.run.runPersonaMapperForSelectedCampaign();
      }

      function openReviewQueue() {
        google.script.run.navigateToReviewQueueSheet();
      }
    </script>
  </body>
</html>
